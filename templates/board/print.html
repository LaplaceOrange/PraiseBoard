<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ snapshot.classroom }} · {{ snapshot.title }}</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e6eeee;color:#18353b;font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;letter-spacing:0}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.print-page{position:relative;background:#fff;width:1080px;height:1440px;padding:58px 64px;margin:0;overflow:hidden}
.print-header{border-bottom:3px solid #147c78;padding-bottom:24px;margin-bottom:28px}
.print-title{font-size:48px;line-height:1.35;margin:0 0 12px;font-weight:700;overflow-wrap:anywhere}
.print-context{font-size:25px;line-height:1.5;color:#51646a;overflow-wrap:anywhere}
.print-content{height:1050px;overflow:hidden}
.print-item{padding:18px 0;border-bottom:1px solid #dce5e6}
.print-item-title{font-size:27px;line-height:1.5;font-weight:650;margin:0 0 10px;overflow-wrap:anywhere}
.print-reason{font-size:27px;line-height:1.5;margin:0 0 10px;overflow-wrap:anywhere}
.print-note{font-size:23px;line-height:1.55;color:#51646a;margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-wrap}
.print-names{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px 22px;font-size:27px;line-height:1.6}
.print-name{max-width:100%;overflow-wrap:anywhere;white-space:pre-wrap}
.print-attribution{font-size:23px;line-height:1.5;color:#51646a;margin:0;overflow-wrap:anywhere}
.print-footer{position:absolute;left:64px;right:64px;bottom:42px;padding-top:16px;border-top:1px solid #dce5e6;display:flex;justify-content:space-between;gap:20px;color:#51646a;font-size:19px;line-height:1.5}
.print-footer span:first-child{overflow-wrap:anywhere;max-width:820px}
.print-footer span:last-child{flex-shrink:0}
{% if screen_preview %}
body{padding:24px 0}
#pages{margin:auto;width:1080px;display:flex;flex-direction:column;gap:24px;transform-origin:top left}
@media(max-width:1100px){body{padding:8px 0}}
{% endif %}
</style>
</head>
<body>
<h1>{{ snapshot.classroom }} · {{ snapshot.title }}</h1>
<div id="pages"></div>
{{ snapshot|json_script:"print-data" }}
<script>
(async()=>{
await document.fonts.ready;
const data=JSON.parse(document.getElementById("print-data").textContent);
const host=document.getElementById("pages");
const element=(tag,cls,text="")=>{const el=document.createElement(tag);el.className=cls;el.textContent=text;return el};
let page,content,subject;
const pageCreate=()=>{
 page=element("article","print-page");
 const header=element("header","print-header");
 header.append(element("h2","print-title",data.title));
 if(data.title.length>40)header.querySelector(".print-title").style.fontSize="34px";
 const day=data.day.split("-").map(Number);
 header.append(element("div","print-context",`${data.classroom} · ${day[0]}年${day[1]}月${day[2]}日`));
 content=element("div","print-content");
 const footer=element("footer","print-footer");footer.append(element("span","",data.footer),element("span","print-page-no"));
 page.append(header,content,footer);host.append(page);
 // Long titles consume space without taking it from the footer.
 const max=footer.offsetTop-content.offsetTop-24;
 content.style.height=`${max}px`;
};
const overflowing=()=>content.scrollHeight>content.clientHeight+1;
const itemCreate=(item,noteText=item.note || "",noteHeight=0)=>{
 const block=element("section","print-item");
 const names=element("h3","print-item-title print-names");
 block.append(names,element("p","print-reason",`表扬项目：${item.title}`));
 let note;
 if(noteText){
  note=element("p","print-note",`原因与备注：${noteText}`);
  if(noteHeight)note.style.minHeight=`${noteHeight}px`;
  block.append(note);
 }
 block.append(element("p","print-attribution",`科目：${subject}${item.teacher ? ` · 教师：${item.teacher}` : ""}`));
 content.append(block);
 return {block,names,note};
};
const notesFor=(item)=>{
 if(!item.note)return {parts:[""],height:0};
 const probe=itemCreate(item," ");
 const longest=item.all_students ? "全班同学" : item.students.reduce(
  (name,student)=>student.name.length>name.length ? student.name : name,""
 );
 probe.names.append(element("span","print-name",longest));
 probe.note.textContent="原因与备注：";
 const limit=Math.max(probe.block.offsetHeight+40,content.clientHeight*.65);
 const parts=[];
 let text="",height=0;
 for(const character of item.note){
  probe.note.textContent=`原因与备注：${text}${character}`;
  if(text && probe.block.offsetHeight>limit){
   probe.note.textContent=`原因与备注：${text}`;
   height=Math.max(height,probe.note.offsetHeight);
   parts.push(text);text=character;
  }else{text+=character;}
 }
 if(text){
  probe.note.textContent=`原因与备注：${text}`;
  height=Math.max(height,probe.note.offsetHeight);
  parts.push(text);
 }
 probe.block.remove();
 return {parts,height};
};
pageCreate();
for(const section of data.sections){
 if(!section.items.length)continue;
 subject=section.subject;
 for(const item of section.items){
  const notes=notesFor(item);
  let current=itemCreate(item,notes.parts[0],notes.height);
  const remainingNotes=()=>{
   const names=[...current.names.children].map(name=>name.textContent);
   for(const noteText of notes.parts.slice(1)){
    pageCreate();current=itemCreate(item,noteText,notes.height);
    names.forEach(name=>current.names.append(element("span","print-name",name)));
   }
  };
  const students=item.all_students ? [{name:"全班同学"}] : item.students;
  for(const student of students){
    const name=element("span","print-name",student.name);
    current.names.append(name);
    if(overflowing()){
     name.remove();
     if(!current.names.children.length){
      current.block.remove();
     }else{remainingNotes();}
     pageCreate();current=itemCreate(item,notes.parts[0],notes.height);
     current.names.append(name);
    }
  }
  remainingNotes();
 }
}
const pages=[...host.querySelectorAll(".print-page")];
pages.forEach((entry,index)=>entry.querySelector(".print-page-no").textContent=`${index+1} / ${pages.length}`);
window.boardReady=true;
{% if screen_preview %}
const resize=()=>{const scale=Math.min(1,(window.innerWidth-16)/1080);host.style.zoom=scale;};
resize();window.addEventListener("resize",resize);
{% endif %}
})();
</script>
</body>
</html>
