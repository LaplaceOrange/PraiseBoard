{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<p>为 {{ target_user }} 设置新密码。此操作只允许管理员执行。新密码生效后，教师可以直接登录。</p>
{% if error %}<p class="errornote">{{ error }}</p>{% endif %}
<form method="post" class="pb-form pb-form--narrow">
  {% csrf_token %}
    <div class="pb-field">
      <label for="id_password">新密码</label>
      <input type="password" name="password" id="id_password" autocomplete="new-password" required>
    </div>
  <div class="pb-actions">
    <button type="submit" class="pb-button pb-button--primary">重置密码</button>
    <a href="{% url 'admin:board_user_changelist' %}" class="pb-button pb-button--secondary">取消</a>
  </div>
</form>
{% endblock %}
